# Release Catalift (ADR-0002, ADR-0013): build the server and migrate images
# and the web build for one commit, push them to Artifact Registry and Cloud
# Storage, then deploy that tag to the VM after the owner approves.
#
# Runs on every push to main (build only) and by hand (Actions > release >
# Run workflow): leave "tag" empty to build and deploy the chosen ref, or give
# an earlier tag to roll back to it without building.
#
# Signs in to Google Cloud with Workload Identity Federation (ADR-0011): no
# key is stored. Repository variables (Settings > Secrets and variables >
# Actions > Variables): GCP_PROJECT, GCP_REGION, GCP_ZONE, GCP_WIF_PROVIDER,
# GCP_CI_SERVICE_ACCOUNT, CATALIFT_VM, CATALIFT_REGISTRY, CATALIFT_WEB_BUCKET
# (the last four from `terraform output`). The deploy job waits for a
# reviewer of the GitHub environment "prod".
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy this existing tag (a short sha) instead of building; for rollback"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ vars.CATALIFT_REGISTRY }}/server:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: migrate image
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/Dockerfile.migrate
          push: true
          tags: ${{ vars.CATALIFT_REGISTRY }}/migrate:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: web build
        working-directory: apps/web
        # Same origin: Caddy serves the app and forwards /v1 to the API, so
        # the API base URL is empty (requests go to /v1/... on this host).
        env:
          VITE_API_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          tar -czf "$RUNNER_TEMP/web.tar.gz" -C dist .
      - name: upload web build
        run: gcloud storage cp "$RUNNER_TEMP/web.tar.gz" "gs://${{ vars.CATALIFT_WEB_BUCKET }}/web/${{ steps.tag.outputs.tag }}.tar.gz"
      - run: 'echo "release: built ${{ steps.tag.outputs.tag }} (server, migrate, web)"'

  deploy:
    needs: build
    # Never on a plain push: a person starts it, and the prod environment's
    # reviewer approves it. A rollback (tag given) skips the build.
    if: always() && github.event_name == 'workflow_dispatch' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.tag != ''))
    runs-on: ubuntu-latest
    environment: prod
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || needs.build.outputs.tag }}
      VM: ${{ vars.CATALIFT_VM }}
      ZONE: ${{ vars.GCP_ZONE }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: copy the deploy files
        run: |
          gcloud compute scp --zone "$ZONE" --tunnel-through-iap --project "${{ vars.GCP_PROJECT }}" \
            deploy/docker-compose.yml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh \
            deploy/catalift-backup.service deploy/catalift-backup.timer "$VM:/tmp/"
      - name: deploy ${{ env.TAG }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "release: bad tag: $TAG"; exit 1; }
          gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --project "${{ vars.GCP_PROJECT }}" --command "
            set -e
            sudo install -d -m 0755 /opt/catalift
            sudo install -m 0644 /tmp/docker-compose.yml /tmp/Caddyfile /tmp/catalift-backup.service /tmp/catalift-backup.timer /opt/catalift/
            sudo install -m 0755 /tmp/deploy.sh /tmp/backup.sh /opt/catalift/
            sudo install -m 0644 /opt/catalift/catalift-backup.service /opt/catalift/catalift-backup.timer /etc/systemd/system/
            sudo systemctl daemon-reload
            sudo systemctl enable --now catalift-backup.timer
            sudo /opt/catalift/deploy.sh '$TAG'
          "
      - run: 'echo "release: deployed $TAG"'
