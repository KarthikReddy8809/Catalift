          type: [string, 'null']
          description: Identifies the rules in force; send it back with PATCH /v1/channels/{channel} (v1.3). Null for a disabled channel.
        last_edit:
          type: [object, 'null']
          description: The last change made in the app, if any; the channel file's rules apply otherwise (v1.3).
          required: [by, at]
          properties:
            by: { type: string, description: Email of the reviewer. }
            at: { type: string, format: date-time }
        listings_total: { type: integer, description: Listings on this channel (v1.1). }
        listings_approved: { type: integer, description: Listings approved at their current version; the export page shows readiness from these (v1.1). }
        export_headers: { type: array, items: { type: string } }
        last_recheck:
          type: [object, 'null']
          required: [config_hash, listings_rechecked, approvals_cleared, created_at]
          properties:
            config_hash: { type: string }
            listings_rechecked: { type: integer }
            approvals_cleared: { type: integer }
            created_at: { type: string, format: date-time }
      example:
        id: amazon_style
        name: Amazon-style marketplace
        enabled: true
        load_error: null
        title_max_length: 200
        required_attributes: [colour, fit]
        banned_words: [best seller, guaranteed]
        listings_total: 300
        listings_approved: 296
        export_headers: [sku, item_name, bullet_point_1, bullet_point_2, bullet_point_3, bullet_point_4, bullet_point_5, product_description, color, fit_type]
        last_recheck: { config_hash: 9b1f2c, listings_rechecked: 300, approvals_cleared: 4, created_at: 2026-10-04T07:00:00Z }
    ChannelRulesUpdate:
      type: object
      required: [config_hash, title_max_length, required_attributes, banned_words]
      properties:
        config_hash: { type: string, description: The channel's config_hash the reviewer edited. }
        title_max_length: { type: integer, minimum: 10, maximum: 500 }
        required_attributes:
          type: array
          items: { type: string, enum: [colour, pattern, sleeve, neckline, fit] }
        banned_words: { type: array, maxItems: 200, items: { type: string, maxLength: 100 } }
      example: { config_hash: 9b1f2c3d4e5f6a7b, title_max_length: 150, required_attributes: [colour, fit], banned_words: [best seller, guaranteed] }
    ChannelRulesResult:
      type: object
      required: [channel, listings_rechecked, approvals_cleared]
      properties:
        channel: { type: string }
        listings_rechecked: { type: integer, minimum: 0 }
        approvals_cleared: { type: integer, minimum: 0 }
      example: { channel: own_website, listings_rechecked: 300, approvals_cleared: 4 }
    ChannelPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Channel' } }
        page: { $ref: '#/components/schemas/Page' }
      example:
        data:
          - { id: own_website, name: Own website, enabled: true, load_error: null, title_max_length: 120, required_attributes: [colour], export_headers: [sku, title, bullet_1, bullet_2, bullet_3, bullet_4, bullet_5, description], last_recheck: null }
        page: { next_cursor: null, has_more: false }
    Export:
      type: object
      required: [id, created_at, files, skipped_channels, sent_at, sent_by]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        sent_at: { type: [string, 'null'], format: date-time, description: When a reviewer sent it to the seller. }
        sent_by: { type: [string, 'null'], description: Email of the reviewer who sent it. }
        files:
          type: array
          items:
            type: object
            required: [channel, row_count, download_url]
            properties:
              channel: { type: string }
              row_count: { type: integer, minimum: 1 }
              download_url: { type: string }
        skipped_channels:
          type: array
          items:
            type: object
            required: [channel, reason]
            properties:
              channel: { type: string }
              reason: { type: string }
      example:
        id: '9'
        created_at: 2026-10-04T11:00:00Z
        files: [{ channel: amazon_style, row_count: 298, download_url: /v1/exports/9/files/amazon_style }]
        skipped_channels: [{ channel: own_website, reason: no approved listings }]
        sent_at: null
        sent_by: null
    ExportPage:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Export' } }
        page: { $ref: '#/components/schemas/Page' }
      example:
        data:
          - id: '9'
            created_at: 2026-10-04T11:00:00Z
            files: [{ channel: amazon_style, row_count: 298, download_url: /v1/exports/9/files/amazon_style }]
            skipped_channels: []
            sent_at: 2026-10-04T11:05:00Z
            sent_by: reviewer@example.com
        page: { next_cursor: null, has_more: false }
    Budget:
      type: object
      required: [limit_micro_usd, spent_micro_usd, blocked_at]
      properties:
        limit_micro_usd: { type: integer, minimum: 1 }
        spent_micro_usd: { type: integer, minimum: 0 }
        blocked_at: { type: [string, 'null'], format: date-time, description: Set on the first refused call; the banner shows while it is set. }
      example: { limit_micro_usd: 8000000, spent_micro_usd: 4210000, blocked_at: null }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
      example: { status: ok }
  responses:
    BadRequest:
      description: Malformed request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: No session, or wrong email or password
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Wrong role or missing CSRF token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No such record
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Idempotency key reused with a different body, or a stale version
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    PayloadTooLarge:
      description: File over its size cap
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnsupportedMediaType:
      description: Wrong file type
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    UnprocessableEntity:
      description: Valid shape, but the content breaks a rule
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Rate limited; see Retry-After
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Unexpected failure; request_id is in the body
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
