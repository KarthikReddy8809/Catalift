openapi: 3.1.0
info:
  title: Catalift API
  version: 1.7.0
  description: |
    The REST API the Catalift web app uses: sellers upload products and start generation, reviewers edit,
    regenerate, approve and export listings, and both see AI cost and the budget state (ADR-0007).
    Serves: US-00-001 to US-00-012. Style: docs/api/README.md. The server default for X-API-Version is the
    newest date version, currently 2026-10-04.
  contact:
    name: Catalift team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-api-style: >-
    REST over HTTPS with JSON bodies, plus multipart for CSV and image uploads and text/csv for export
    downloads; one Go service exposing five areas (auth, catalogue, listings, export, cost) under one /v1.
  x-versioning: >-
    Major in the path (/v1, ADR-0007); dated behaviour changes inside a major in X-API-Version, server
    default the newest (2026-10-04).
  x-authentication: >-
    A server-side session in an HTTP-only secure cookie (catalift_session) set by POST /v1/sessions, with
    an X-CSRF-Token header on every state-changing request (ADR-0006). Roles seller and reviewer are
    checked on every route; a seller calling a reviewer action gets 403 forbidden_role.
  x-conventions:
    - rule: 'The base path is /v1, not /api/v1.'
      why: 'ADR-0007 and HLD section 5 fixed /v1; the reverse proxy forwards /v1 and serves the web app at /.'
    - rule: 'Authentication is a session cookie plus X-CSRF-Token, not a bearer JWT.'
      why: 'ADR-0006 chose server-side sessions for a handful of seeded users, revocable at once; the CSRF header closes the cookie''s cross-site risk.'
    - rule: 'A seller calling a reviewer-only operation gets 403 forbidden_role, not 404.'
      why: 'AC-US-00-009-5 and ADR-0006 require a visible refusal; one organisation per deployment means every record is visible to every signed-in user, so 403 leaks nothing.'
    - rule: 'Ids are decimal strings of the database''s bigint ids.'
      why: 'The data model uses bigint identity ids (data-model deviation 1); strings keep the style''s id type and avoid JavaScript number precision limits.'
    - rule: 'AI cost is an integer cost_micro_usd (millionths of a US dollar), not an amount_minor with currency.'
      why: 'OpenRouter bills only in USD and single calls cost fractions of a cent (data-model deviation 3).'
    - rule: 'CSV and images are uploaded as multipart through the API, not by signed URL; caps are 5 MB per CSV and 10 MB per image.'
      why: 'PRD Constraints and ADR-0002 keep files on the VM''s local disk; there is no object store to sign URLs for.'
    - rule: 'Edits carry the listing or attribute version they were made against; a stale version is 409 version_conflict.'
      why: 'Tenet 5 and D5, D12: approval covers one exact version, so an edit made from an old screen must not land silently.'
    - rule: 'Rate limits are 300 requests a minute per session and 1,200 a minute per IP; sign-in is limited to 10 attempts per 15 minutes per IP (assumption, owner to confirm).'
      why: 'The style requires stated numbers; HLD section 9 asks for a sign-in rate limit; two users never come near the general limits.'
servers:
  - url: /v1
    description: Same origin as the web app; the reverse proxy forwards /v1 to the API (HLD section 3)
security:
  - sessionCookie: []
tags:
  - name: sessions
    description: Sign in, see who is signed in, sign out (ADR-0006).
  - name: brands
    description: Brands from the CSV and their voice notes (US-00-003).
  - name: uploads
    description: CSV and image uploads with their summaries (US-00-001).
  - name: products
    description: Products, their detected attributes and their AI cost (US-00-001, US-00-002, US-00-007, US-00-011).
  - name: generation
    description: Starting, following and resuming generation (US-00-002, US-00-003, US-00-012).
  - name: listings
    description: The review grid, edits, regenerations and approvals (US-00-004, US-00-007, US-00-008, US-00-009).
  - name: channels
    description: Configured channels, their rules and re-check counts (US-00-005, US-00-006).
  - name: exports
    description: One CSV per channel of approved listings (US-00-010).
  - name: budget
    description: AI spend against the USD 8 limit and the blocked state (US-00-011, US-00-012).
  - name: health
    description: Liveness for the uptime check (HLD section 10).

paths:
  /sessions:
    post:
      operationId: createSession
      summary: Sign in
      description: >-
        Checks email and password and sets the catalift_session cookie. Public by necessity (no session
        exists yet). Not idempotency-keyed: a repeated sign-in replaces the cookie and creates no record a
        user can see. Returns 200 with the CSRF token to send on later writes.
      tags: [sessions]
      security: []
      x-story-ids: [ADR-0006, US-00-009, US-00-010]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreate' }
            example: { email: reviewer@catalift.example, password: correct-horse-battery }
      responses:
        '200':
          description: Signed in; Set-Cookie carries the session
          headers:
            Set-Cookie: { schema: { type: string }, description: 'catalift_session; HttpOnly; Secure; SameSite=Lax' }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /sessions/current:
    get:
      operationId: getCurrentSession
      summary: Who is signed in
      tags: [sessions]
      x-story-ids: [ADR-0006, US-00-009]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The signed-in user and the CSRF token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteCurrentSession
      summary: Sign out
      tags: [sessions]
      x-story-ids: [ADR-0006]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Signed out; the cookie is cleared
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /brands:
    get:
      operationId: listBrands
      summary: List brands with their voice notes
      description: With filter[upload_id], only brands named by that upload's products (v1.7).
      tags: [brands]
      x-story-ids: [US-00-003]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UploadFilter'
      responses:
        '200':
          description: One page of brands, by name
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /brands/{brand_id}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    patch:
      operationId: updateBrand
      summary: Set a brand's voice (seller)
      description: >-
        Replaces the tone (voice_note) and, when given, the words to avoid; sending the same values twice leaves the
        same state. Words are trimmed, blanks and repeats (ignoring case) dropped; at most 50, each at most 60
        characters. A new list re-checks the brand's listings: a word to avoid in one is a brand_avoid_word failure,
        and an approved listing that now fails loses its approval (v1.6, ADR-0012).
      tags: [brands]
      x-story-ids: [US-00-003]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandUpdate' }
            example: { voice_note: Warm and plain-spoken; no slang; mention fabric first., words_to_avoid: [cheap, best ever] }
      responses:
        '200':
          description: The updated brand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /uploads:
    post:
      operationId: createUpload
      summary: Upload a product CSV
      description: >-
        Multipart CSV with columns sku, category, brand, price. Creates one product per valid row and reports
        rejected rows with their reasons, including a SKU repeated in the file or already in Catalift (D21).
        Brands named for the first time are created.
      tags: [uploads]
      x-story-ids: [US-00-001]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadCreate' }
      responses:
        '201':
          description: Upload summary
          headers:
            Location: { schema: { type: string, format: uri } }
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /uploads/latest:
    get:
      operationId: getLatestUpload
      summary: Get the newest upload's summary
      description: >-
        The screens show only the newest upload's records; older uploads stay in the database. 404 before any upload
        (v1.7).
      tags: [uploads]
      x-story-ids: [US-00-001]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The newest upload's summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /uploads/{upload_id}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    get:
      operationId: getUpload
      summary: Get an upload's summary
      tags: [uploads]
      x-story-ids: [US-00-001, US-00-011]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The upload summary with its rejected rows and AI cost total
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /uploads/{upload_id}/images:
    parameters:
      - $ref: '#/components/parameters/UploadId'
    post:
      operationId: createUploadImages
      summary: Upload images for an upload's products
      description: >-
        Multipart image files. Each attaches to the SKU its name starts with, followed by _, -, . or the end of
        the name; the longest matching SKU wins (D20). Unmatched files and products still without an image are
        listed in the response.
      tags: [uploads]
      x-story-ids: [US-00-001]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImagesCreate' }
      responses:
        '201':
          description: Images attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }

  /products:
    get:
      operationId: listProducts
      summary: List products with detection status and AI cost
      tags: [products]
      x-story-ids: [US-00-001, US-00-002, US-00-011]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: filter[upload_id]
          in: query
          description: Only products from this upload (served by idx_products_upload_id).
          schema: { type: string, pattern: '^[0-9]+$' }
        - name: filter[detection_status]
          in: query
          description: Only products in this detection state (sequential scan by design, under 10^4 rows).
          schema: { $ref: '#/components/schemas/DetectionStatus' }
      responses:
        '200':
          description: One page of products, by SKU
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProduct
      summary: Get one product
      tags: [products]
      x-story-ids: [US-00-001, US-00-002, US-00-011]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The product with its attributes, images and AI cost
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateProduct
      summary: Correct a product's details (seller)
      description: >-
        Re-checks SKU, category, brand and price with the upload's rules and saves them, or says why not (v1.5). A
        product whose listings a reviewer approved can no longer change (422).
      tags: [products]
      x-story-ids: [US-00-001]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RowFix' }
      responses:
        '200':
          description: Saved, or refused with the reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductSaveResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /products/{product_id}/enrich:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: enrichProduct
      summary: Run the vision call again for one product (seller)
      description: >-
        Resets the product's detection, queues every channel's listing again and makes one enrich-v1 vision call for
        this product only (v1.5). It counts toward the budget; refused while the budget is blocked or the product has
        no photo (422).
      tags: [products]
      x-story-ids: [US-00-002, US-00-003]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: The run that tracks the call
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /products/{product_id}/image:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getProductImage
      summary: Get a product's thumbnail
      description: The product's first photo as its 1024 px JPEG detection copy, for the review grid (v1.2).
      tags: [products]
      x-story-ids: [US-00-007]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The thumbnail
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /products/{product_id}/images:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    post:
      operationId: createProductImages
      summary: Add photos to one product (seller)
      description: >-
        Attaches the photos to this product whatever the files are called: the fix for a product left without a photo
        (v1.4). The same type, size and pixel checks as an upload apply.
      tags: [products]
      x-story-ids: [US-00-001]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ImagesCreate' }
      responses:
        '201':
          description: The photos attached and those refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }
  /row-errors:
    get:
      operationId: listRowErrors
      summary: Rejected CSV rows not yet fixed
      description: >-
        Every row an upload refused and the seller has not corrected yet, with the values as typed and the categories a
        correction may use (v1.4).
      tags: [uploads]
      x-story-ids: [US-00-001]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - name: filter[upload_id]
          in: query
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: The open rejected rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RowErrorList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: discardRowErrors
      summary: Discard every rejected row (seller)
      description: >-
        Drops every open rejected row, or one upload's with filter[upload_id], so the seller can clear rows they will
        not load. Nothing else changes; discarding twice discards nothing the second time (v1.5).
      tags: [uploads]
      x-story-ids: [US-00-001]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
        - name: filter[upload_id]
          in: query
          schema: { type: string, pattern: '^[0-9]+$' }
      responses:
        '200':
          description: How many rows were discarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscardResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /uploads/{upload_id}/rows/{row_number}:
    parameters:
      - $ref: '#/components/parameters/UploadId'
      - name: row_number
        in: path
        required: true
        schema: { type: integer, minimum: 2 }
    put:
      operationId: updateRow
      summary: Correct a rejected row and send it again (seller)
      description: >-
        Re-checks the corrected values with the upload's rules. A valid row becomes a product of the upload and its
        error is removed; an invalid one keeps its error with the new reason (v1.4).
      tags: [uploads]
      x-story-ids: [US-00-001]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RowFix' }
      responses:
        '200':
          description: Loaded, or rejected again with the reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RowFixResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: discardRow
      summary: Discard one rejected row (seller)
      description: >-
        Drops the row's error so it no longer shows as not loaded. A row with no open error is 404 not_found (v1.5).
      tags: [uploads]
      x-story-ids: [US-00-001]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Discarded
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /products/{product_id}/attributes:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    patch:
      operationId: updateProductAttributes
      summary: Correct detected attributes (reviewer)
      description: >-
        Sets the given attributes, raises the attribute revision and, in the same transaction, raises the version
        of every listing of the product, clears their approvals and re-checks their rules (D5). The body carries
        the revision it was made against; a stale revision is 409 version_conflict, so a retry cannot apply twice.
      tags: [products]
      x-story-ids: [US-00-007]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttributesUpdate' }
            example: { revision: 1, colour: black }
      responses:
        '200':
          description: The corrected attributes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductAttributes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /generation-runs:
    post:
      operationId: createGenerationRun
      summary: Start generation
      description: >-
        Queues work for every (product, enabled channel) with no listing, a failed one or a stopped_budget one,
        and detection for products whose detection is pending, failed or stopped (D6). Refused with 422
        voice_note_required when a brand in scope has no voice note and neutral_voice_confirmed is false
        (AC-US-00-003-5), and with 422 budget_blocked while the budget is blocked (D13).
      tags: [generation]
      x-story-ids: [US-00-002, US-00-003]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerationRunCreate' }
            example: { neutral_voice_confirmed: false }
      responses:
        '201':
          description: The run, with what was queued
          headers:
            Location: { schema: { type: string, format: uri } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /generation-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getGenerationRun
      summary: Follow a run's progress
      description: The web app polls this; the seller can close the page and come back (AC-US-00-003-6).
      tags: [generation]
      x-story-ids: [US-00-003, US-00-012]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: Progress counts for the run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /generation-runs/{run_id}/resume:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: resumeGenerationRun
      summary: Resume failed and stopped work in a run
      description: >-
        Queues again the run's failed and stopped_budget detection and generation (D6). Live work is not queued
        twice: a repeat while work is still queued queues nothing new, so the call is safe to retry.
      tags: [generation]
      x-story-ids: [US-00-003, US-00-012]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: What was queued again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /listings:
    get:
      operationId: listListings
      summary: The review grid
      description: One row per product and channel (AC-US-00-007-1), by product SKU then channel.
      tags: [listings]
      x-story-ids: [US-00-004, US-00-007, US-00-009]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UploadFilter'
        - name: filter[channel]
          in: query
          description: Only this channel (AC-US-00-007-5; sequential scan by design, under 10^4 rows).
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
        - name: filter[rule_status]
          in: query
          description: Only this rule status (AC-US-00-007-5; sequential scan by design).
          schema: { $ref: '#/components/schemas/RuleStatus' }
        - name: filter[approved]
          in: query
          description: Only approved (true) or unapproved (false) listings.
          schema: { type: boolean }
      responses:
        '200':
          description: One page of grid rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /listings/{listing_id}:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      operationId: getListing
      summary: Get one listing with its rule failures
      tags: [listings]
      x-story-ids: [US-00-004, US-00-007]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateListing
      summary: Edit listing text (reviewer)
      description: >-
        Saves the given fields, raises the version, clears any approval and re-checks the rules in one transaction
        (AC-US-00-007-2 and -4, AC-US-00-004-6). The body carries the version it was made against; a stale
        version is 409 version_conflict, so a retry cannot apply twice.
      tags: [listings]
      x-story-ids: [US-00-007, US-00-004]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
            example: { version: 2, title: 'Women''s Black Cotton Kurta, Regular Fit' }
      responses:
        '200':
          description: The listing after the edit and re-check
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /listings/{listing_id}/regeneration-requests:
    parameters:
      - $ref: '#/components/parameters/ListingId'
    get:
      operationId: listRegenerationRequests
      summary: A listing's regeneration requests
      tags: [listings]
      x-story-ids: [US-00-008]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of requests, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegenerationRequestPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createRegenerationRequest
      summary: Regenerate one field with an instruction (reviewer)
      description: >-
        Queues a regeneration of one field. The result applies only if the field still holds its value at request
        time; otherwise the request ends superseded (D12). Allowed only on a generated listing (422
        listing_not_generated) and not while the budget is blocked (422 budget_blocked).
      tags: [listings]
      x-story-ids: [US-00-008]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegenerationRequestCreate' }
            example: { field: title, instruction: 'Shorter, and mention cotton.' }
      responses:
        '201':
          description: The queued request
          headers:
            Location: { schema: { type: string, format: uri } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegenerationRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /approvals:
    post:
      operationId: createApprovals
      summary: Approve many listings (reviewer)
      description: >-
        Approves each listed (listing_id, version) whose listing is still at that version and passing its rules, in
        one statement per listing; the rest are skipped with a reason (AC-US-00-009-1 to -3, Q-009).
      tags: [listings]
      x-story-ids: [US-00-009]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalBatchCreate' }
            example:
              items:
                - { listing_id: '412', version: 3 }
                - { listing_id: '413', version: 1 }
      responses:
        '201':
          description: Approved and skipped listings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalBatchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /rule-checks:
    post:
      operationId: createRuleCheck
      summary: Check draft listing text against its channel's rules (reviewer)
      description: >-
        Runs the rules engine on a listing with the given fields replaced, and saves nothing, so the editor's badge
        updates as the reviewer types (v1.2). It changes no state, so it takes no Idempotency-Key.
      tags: [listings]
      x-story-ids: [US-00-004, US-00-007]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleCheckCreate' }
      responses:
        '200':
          description: The rules' verdict on the draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleCheckResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /channels:
    get:
      operationId: listChannels
      summary: Configured channels, their rules and the last re-check
      description: >-
        Channels come from configuration files (REQ-017). A channel whose file failed to load is listed disabled with
        the error (D8); the last config re-check per channel carries the counts the grid shows (D7).
      tags: [channels]
      x-story-ids: [US-00-005, US-00-006, US-00-004]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UploadFilter'
      responses:
        '200':
          description: One page of channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /channels/{channel}:
    parameters:
      - name: channel
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
    patch:
      operationId: updateChannelRules
      summary: Change a channel's rules (reviewer)
      description: >-
        Saves a reviewer's change to the title length limit, required attributes and banned words, records who made
        it, and re-checks the channel's listings at once; an approved listing that now fails loses its approval (D7).
        The body carries the config_hash from GET /v1/channels; a change made by someone else meanwhile is 409
        version_conflict (v1.3).
      tags: [channels]
      x-story-ids: [US-00-005, US-00-004]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChannelRulesUpdate' }
      responses:
        '200':
          description: The re-check the change caused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelRulesResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /exports:
    get:
      operationId: listExports
      summary: List exports, newest first
      description: >-
        A reviewer sees every export, or only sent ones with filter[sent]=true. A seller always sees only the exports
        a reviewer sent them (v1.6, ADR-0012).
      tags: [exports]
      x-story-ids: [US-00-010]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UploadFilter'
        - name: filter[sent]
          in: query
          schema: { type: string, enum: ['true'] }
      responses:
        '200':
          description: One page of exports
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createExport
      summary: Export approved listings (reviewer)
      description: >-
        Writes one CSV per channel holding only listings approved at their current version, with headers from the
        channel's configuration and cells starting with =, +, - or @ escaped. A channel with no approved listings
        gets no file and is listed in skipped_channels (AC-US-00-010-5). With a body naming upload_id, only that
        upload's listings are exported; without a body, every upload's (v1.7).
      tags: [exports]
      x-story-ids: [US-00-010]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                upload_id: { type: string, pattern: '^[0-9]+$' }
            example: { upload_id: '12' }
      responses:
        '201':
          description: The export and its files
          headers:
            Location: { schema: { type: string, format: uri } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exports/{export_id}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: getExport
      summary: Get an export and its files
      description: A seller gets 404 for an export not yet sent to them (v1.6).
      tags: [exports]
      x-story-ids: [US-00-010]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exports/{export_id}/send:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    post:
      operationId: sendExport
      summary: Send an export to the seller (reviewer)
      description: >-
        Marks the export as sent, with who sent it and when, so it appears in the seller's received exports and the
        seller can download its files. Sending again changes nothing and returns the first send (v1.6, ADR-0012).
      tags: [exports]
      x-story-ids: [US-00-010]
      x-idempotent: true
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: The sent export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Export' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /exports/{export_id}/files/{channel}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
      - name: channel
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,39}$' }
    get:
      operationId: getExportFile
      summary: Download one channel's CSV
      description: Reviewers download any export; a seller only one sent to them, otherwise 404 (v1.6).
      tags: [exports]
      x-story-ids: [US-00-010]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The CSV file
          headers:
            Content-Disposition: { schema: { type: string }, description: 'attachment; filename="<channel>-<export_id>.csv"' }
          content:
            text/csv:
              schema: { type: string }
              example: "sku,title,bullet_1,bullet_2,bullet_3,bullet_4,bullet_5,description,colour,pattern,sleeve,neckline,fit\nKU-104,Women's Black Cotton Kurta,...\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /budget:
    get:
      operationId: getBudget
      summary: AI spend, the limit and whether calls are blocked
      description: >-
        spent_micro_usd uses the one spend expression of the data model (succeeded at cost, failed at cost or 0,
        reserved and possibly_charged at their reservation). blocked_at drives the banner (D13).
      tags: [budget]
      x-story-ids: [US-00-011, US-00-012]
      parameters:
        - $ref: '#/components/parameters/ApiVersion'
      responses:
        '200':
          description: The budget state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Budget' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /healthz:
    get:
      operationId: getHealth
      summary: Liveness
      description: Public so the Cloud Monitoring uptime check can call it without a session (HLD section 10).
      tags: [health]
      security: []
      x-story-ids: [ADR-0010]
      responses:
        '200':
          description: The API and its database answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: catalift_session
      description: Server-side session set by POST /v1/sessions (ADR-0006).
  parameters:
    ApiVersion:
      name: X-API-Version
      in: header
      required: false
      description: Date version, e.g. 2026-10-04. Missing means the server default (the newest).
      schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client UUID. Same key and body replays the first result for 24 hours; same key and a different body is 409 idempotency_conflict.
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The csrf_token from the session; required on every state-changing request (ADR-0006).
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from page.next_cursor.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    BrandId:
      name: brand_id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    UploadFilter:
      name: filter[upload_id]
      in: query
      description: Only this upload's records; the screens pass the latest upload (v1.7).
      schema: { type: string, pattern: '^[0-9]+$' }
    ProductId:
      name: product_id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    ListingId:
      name: listing_id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
    ExportId:
      name: export_id
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9]+$' }
  headers:
    XRequestId:
      schema: { type: string }
      description: Echoed or generated request id; quote it in support tickets.
  schemas:
    Error:
      type: object
      required: [error]
      x-error-codes:
        - { code: validation_failed, status: 400, meaning: "Malformed request, an unknown filter, or a field failed validation; details names the field." }
        - { code: unauthorized, status: 401, meaning: "No session, an expired one, or wrong email or password at sign-in." }
        - { code: forbidden_role, status: 403, meaning: "Signed in, but this action needs the reviewer role (AC-US-00-009-5)." }
        - { code: csrf_failed, status: 403, meaning: "X-CSRF-Token missing or not this session's token." }
        - { code: not_found, status: 404, meaning: "No such record." }
        - { code: idempotency_conflict, status: 409, meaning: "Idempotency-Key reused with a different body." }
        - { code: version_conflict, status: 409, meaning: "The listing or attributes changed since the version sent; reload and retry." }
        - { code: payload_too_large, status: 413, meaning: "CSV over 5 MB or an image over 10 MB." }
        - { code: unsupported_media_type, status: 415, meaning: "Not CSV, or an image that is not JPEG, PNG or WebP." }
        - { code: unprocessable, status: 422, meaning: "Valid shape but the content breaks a rule; details names it." }
        - { code: voice_note_required, status: 422, meaning: "A brand in scope has no voice note and neutral_voice_confirmed is false (AC-US-00-003-5)." }
        - { code: budget_blocked, status: 422, meaning: "AI calls are blocked until the owner clears the budget block (D13)." }
        - { code: listing_not_generated, status: 422, meaning: "The listing has no generated text yet, so a field cannot be regenerated." }
        - { code: no_approved_listings, status: 422, meaning: "No channel has an approved listing, so no file would be written (AC-US-00-010-5)." }
        - { code: rate_limited, status: 429, meaning: "Too many requests; wait Retry-After seconds." }
        - { code: internal, status: 500, meaning: "Unexpected failure; quote request_id to support." }
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }
            request_id: { type: string }
      example:
        error:
          code: voice_note_required
          message: Brand Indigo Loom has no voice note; add one or confirm a neutral voice.
          details: [{ field: neutral_voice_confirmed, reason: must be true when a brand has no voice note }]
          request_id: req_01J9Z6
